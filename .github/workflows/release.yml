name: Release

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ac-release-main
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-2022
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Check out the triggering commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Publish a new version
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
          GH_PROMPT_DISABLED: '1'
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          Add-Type -AssemblyName System.Numerics

          function ConvertTo-ReleaseVersion {
              param([string] $Text)
              if ($Text -cnotmatch '^[0-9]+\.[0-9]+(?:\.[0-9]+)?(?:-beta)?$') {
                  throw 'VERSION must contain major.minor or major.minor.patch, optionally followed by -beta (for example, 5.1-beta).'
              }
              [bigint[]] $parts = @($Text.Split('-')[0].Split('.') | ForEach-Object { [bigint]::Parse($_) })
              if ($parts.Count -eq 2) { $parts += [bigint] 0 }
              # Stable follows beta for the same numeric version.
              $parts += [bigint] $(if ($Text.EndsWith('-beta')) { 0 } else { 1 })
              return ,$parts
          }

          function Compare-ReleaseVersion {
              param([bigint[]] $Left, [bigint[]] $Right)
              for ($i = 0; $i -lt 4; $i++) {
                  $comparison = $Left[$i].CompareTo($Right[$i])
                  if ($comparison -ne 0) { return $comparison }
              }
              return 0
          }

          function Get-GitHubPages {
              param([string] $Resource)
              $page = 1
              do {
                  $response = & gh api "repos/$env:GITHUB_REPOSITORY/${Resource}?per_page=100&page=$page"
                  if ($LASTEXITCODE -ne 0) {
                      throw "GitHub $Resource query failed; release eligibility is unknown. Retry after resolving the API error."
                  }
                  $json = $response -join "`n"
                  if (-not $json.TrimStart().StartsWith('[')) {
                      throw "Unexpected response to GitHub $Resource query."
                  }
                  [object[]] $items = ConvertFrom-Json -InputObject $json
                  $items
                  $page++
              } while ($items.Count -eq 100)
          }

          $version = [System.IO.File]::ReadAllText((Join-Path $PWD 'VERSION')).Trim()
          $candidate = ConvertTo-ReleaseVersion $version
          $tag = "v$version"
          $releases = @(Get-GitHubPages 'releases')
          $highest = $null
          $highestTag = $null
          foreach ($release in $releases) {
              # Legacy non-version tags do not participate in numeric ordering.
              if ($release.tag_name -cnotmatch '^v?([0-9]+\.[0-9]+(?:\.[0-9]+)?(?:-beta)?)$') { continue }
              $existing = ConvertTo-ReleaseVersion $Matches[1]
              if ($release.draft) {
                  if ((Compare-ReleaseVersion $candidate $existing) -eq 0) {
                      throw "Unfinished draft '$($release.tag_name)' exists. Review its target and assets, then finish or remove the draft manually before retrying."
                  }
                  continue
              }
              if ($null -eq $highest -or (Compare-ReleaseVersion $existing $highest) -gt 0) {
                  $highest = $existing
                  $highestTag = $release.tag_name
              }
          }
          if ($null -ne $highest -and (Compare-ReleaseVersion $candidate $highest) -le 0) {
              "Skipping $tag`: VERSION is not higher than published release $highestTag." |
                  Tee-Object -FilePath $env:GITHUB_STEP_SUMMARY -Append
              exit 0
          }

          # Reserve aliases too: v5.1-beta and v5.1.0-beta are the same version.
          foreach ($existingTag in @(Get-GitHubPages 'tags')) {
              if ($existingTag.name -cnotmatch '^v?([0-9]+\.[0-9]+(?:\.[0-9]+)?(?:-beta)?)$') { continue }
              $existing = ConvertTo-ReleaseVersion $Matches[1]
              if ((Compare-ReleaseVersion $candidate $existing) -eq 0) {
                  throw "Tag '$($existingTag.name)' already exists without a qualifying published release. Review it manually; this workflow will not reuse, move, or delete tags."
              }
          }

          # The builder verifies the allowlist, archive paths and every source hash.
          & .\scripts\build.ps1
          $assets = @(
              (Join-Path $PWD "dist/AbsoluteCamera-v$version.zip"),
              (Join-Path $PWD "dist/AbsoluteCamera-pMarK-Presets-v$version.zip"),
              (Join-Path $PWD 'dist/absolute_camera_input.settings_patch.txt')
          )
          foreach ($asset in $assets) {
              if (-not (Test-Path -LiteralPath $asset -PathType Leaf)) {
                  throw "The builder did not produce $asset."
              }
          }

          # Keep failed uploads unpublished. A leftover draft requires manual review.
          & gh release create $tag --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "Absolute Camera v$version" --generate-notes --draft
          if ($LASTEXITCODE -ne 0) { throw 'Draft creation failed. Inspect GitHub for a partial draft or tag before retrying.' }
          foreach ($asset in $assets) {
              & gh release upload $tag $asset --repo $env:GITHUB_REPOSITORY
              if ($LASTEXITCODE -ne 0) { throw "Asset upload failed for $asset; the release remains a draft. Review it manually before retrying." }
          }
          & gh release edit $tag --repo $env:GITHUB_REPOSITORY --draft=false --latest
          if ($LASTEXITCODE -ne 0) { throw 'Publication failed. Check the release state on GitHub before retrying.' }
          "Published $tag from $env:GITHUB_SHA with both verified ZIPs and the unchanged input patch." |
              Tee-Object -FilePath $env:GITHUB_STEP_SUMMARY -Append
